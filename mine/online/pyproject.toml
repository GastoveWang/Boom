[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boom-online"
version = "0.1.0"
description = "Jetson real-time artillery-event detection for Spinnaker cameras"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "Pillow",
]

[project.scripts]
boom-online = "realtime_runner:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["realtime_runner", "spin_camera", "spinnaker_camera"]
