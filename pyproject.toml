[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "boom"
version = "0.1.0"
description = "Boom: Real-time Wildland Smoke Detection & Geolocation for UAVs"
readme = "doc/PROJECT_STRUCTURE.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "opencv-python",
    "pyyaml",
    "pillow",
]

[project.optional-dependencies]
st2-visualization = [
    "torch",
    "kornia==0.8.2",
    "torchview>=0.2.7",
    "graphviz>=0.20",
]
st2 = [
    "torch",
    "kornia==0.8.2",
    "scipy",
    "tqdm",
    "tensorboard",
]
bbox = [
    "torch",
    "scipy",
]
ml = [
    "torch",
    "torchvision",
    "ultralytics",
]
onnx = [
    "onnxruntime",
]
onnx-gpu = [
    "onnxruntime-gpu",
]
geo = [
    "rasterio",
    "pyproj",
    "affine",
]
test = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]
