[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "boom"
version = "0.1.0"
description = "Boom: Real-time Wildland Smoke Detection & Geolocation for UAVs"
readme = "PROJECT_STRUCTURE.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "opencv-python",
    "pyyaml",
    "pillow",
]

[project.optional-dependencies]
ml = [
    "torch",
    "torchvision",
]
geo = [
    "rasterio",
    "pyproj",
    "affine",
]
test = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]
